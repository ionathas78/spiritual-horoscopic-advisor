        draw_touchstone_tarot: lens_draw
        tarot_mode_selection: mode_bind
        select_quote: quote_bind
        select_scripture_reference: anchor_bind
        resolve_output_profile: profile_resolve
        scripture_context_guard: context_guard
        build_hyperlink_objects: link_object_build
        study_pass: study_brief_build
        thesis_synthesis: thesis_bind
        resolve_prayer_output: prayer_resolve
        quote_surface: quote_surface_render
        reference_surface: reference_surface_render
        assemble: assemble_render_slots
        conceptual_attractor_pass: shape_guidance
        draft_zero: free_draft
        structural_draft_pass: structure_pass
        theology_pass: doctrine_pass
        pastoral_safety_check: care_pass
        coherence_pass: clarity_pass
        applicability_pass: life_pass
        voice_pass: tone_pass
        compression_pass: trim_pass
        literary_style_pass: beauty_pass
        memorization_pass: retention_pass
        tts_pass: spoken_pass
        length_pass: band_pass
        sounding_pass: cadence_pass
        validate_payoff_anchor: payoff_check
        score_governing_metaphor: metaphor_score
        reference_lineage_finalize: lineage_finalize
        select_image: image_pick
        lint_and_sanity_check: sanity_gate
        final_render: rich_render
        verify_render_shape: shape_check
        apply_degraded_fallback: plain_fallback
        scripture_quote_dependency_guard: dependency_guard
