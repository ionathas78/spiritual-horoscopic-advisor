weekly_theme_policy:
  allow:
  - deliberate_motif_reuse_within_week
  - escalating_application_seed_to_harvest
  - consistent ethical through-line
  continuity_scope_default: devotional_only
  enabled_when_user_pref_enabled: true
  forbid:
  - explicit_backreferences_to_prior_days
  - reliance_on_chat_carryover_for_continuity
  rule: 'Each day must stand alone, yet intentionally echo the weekly theme. Continuity is achieved by
    recurring motifs (image/phrase/tension), not by referencing prior days.

    '
writing_team:
  contextual_awareness:
    holidays:
      enabled: true
      priority: secondary
      purpose: 'Holidays may gently influence illustration or application, but never override theological
        theme.

        '
      rules:
      - never override primary theological theme
      - do not force mention
      - subtlety preferred
    news_awareness:
      enabled: true
      priority: secondary
      purpose: 'Major daily news may inform application sparingly, without making the devotional feel
        targeted.

        '
      rules:
      - never partisan
      - never inflammatory
      - application_segment_only_preference: true
      - do_not_reference_same_event_more_than_once_within_7_days: true
  max_writers_including_lead: 6
  min_writers_including_lead: 4
  roles_policy: 'Roles are illustrative and adaptive.

    No fixed or canonical roles.

    Future iterations may introduce new roles as needed.

    '
reader_contract_preferences:
  output_profile:
    artifact_type:
      type: string
      allowed:
      - devotional
      - study_guide
      default: devotional
      governing_rule: >
        Artifact type selects the reader-facing document shape. Study guides are
        optional companion artifacts and do not replace the canonical devotional.
    content_length:
      type: string
      allowed:
      - condensed
      - standard
      - expanded
      default: standard
      governing_rule: >
        Length changes rhetorical development, not required surface order,
        scriptural primacy, source integrity, or spoken-language quality.
    render_target:
      type: string
      allowed:
      - ui
      - pdf
      default: ui
      governing_rule: >
        UI may use image and entity components. PDF is text-first and must not
        contain images, entity components, or UI-only render tokens.
    axis_independence:
      required: true
      rules:
      - artifact_type_does_not_imply_content_length
      - render_target_does_not_imply_content_length
      - content_length_does_not_imply_source_count
      - source_count_emerges_from_material_influence_not_profile_selection
    standard_audio_optimization:
      enabled: true
      applies_to:
      - condensed
      - standard
      - expanded
      rules:
      - prose_must_read_naturally_aloud
      - images_must_be_additive_not_semantically_required
      - avoid_visual_only_deixis
      - attribution_and_transitions_must_survive_tts
  devotional_title:
    show:
      type: boolean
      default: false
  additional_references:
    show:
      type: boolean
      default: true
    description: >
      Show materially influential supporting sources. This preference controls
      visibility, not whether the study pass occurs.
  prayer:
    mode:
      type: string
      allowed:
      - none
      - generated
      - liturgical
      default: none
      governing_rule: >
        Prayer output is optional. Generated prayer is composed from the devotional's
        thesis, primary Scripture, and pastoral movement. Liturgical prayer seeks an
        established prayer appropriate to the calendar date and selected tradition.
    liturgical_tradition:
      type: string
      allowed:
      - auto
      - catholic
      - anglican
      default: auto
      governing_rule: >
        Tradition selection applies only when prayer mode is liturgical. Auto may use
        a stored reader tradition when available; otherwise it may use an appropriate
        Catholic or Anglican source that can be responsibly identified and rendered.
    fallback_when_liturgical_unavailable:
      type: string
      allowed:
      - generated
      - none
      default: generated
      governing_rule: >
        When no suitable date-specific liturgical prayer can be responsibly sourced
        or rendered, use the selected fallback without reconstructing or inventing
        historic liturgical text.
    source_identification_required_for_liturgical:
      type: boolean
      default: true
    generated_prayer_must_not_be_presented_as_historic_liturgy:
      type: boolean
      default: true
  study_guide:
    default_render:
      type: boolean
      default: false
    allow_on_request:
      type: boolean
      default: true
  reading_profile:
    reading_complexity:
      type: string
      allowed:
      - early_reader
      - elementary
      - middle_school
      - high_school
      - college
      - college_advanced
      default: college
    spiritual_depth:
      type: string
      allowed:
      - seeker
      - foundational
      - growing
      - mature
      - scholarly
      default: mature
    dyslexia_optimization:
      type: boolean
      default: false
    governing_rule: >
      Reading complexity and spiritual depth are independent preferences.
      Natural written prose remains the default at every reading level.
  source_affinity:
    enabled:
      type: boolean
      default: true
    preferred_source_classes:
      type: list
      allowed:
      - wisdom_literature
      - church_fathers
      - historic_theologians
      - modern_theologians
      - modern_christian_authors
      - literary_sources
      default: []
    preferred_authors:
      type: list
      default: []
    governing_rule: >
      Source affinity influences tie-breaking and recurrence but never overrides
      scripture, contextual fit, or source diversity.
  production_metadata:
    show_debug_footer:
      type: boolean
      default: false
    governing_rule: production_devotionals_do_not_announce_engine_workflow

