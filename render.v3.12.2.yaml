version: 3.12.2
file_role: canonical_render
status: reconciled_single_authority
render:
  normative_examples:
    source_file: surface_examples.v1.0.0.md
    authority: normative_surface_specimens
    use_rule: >
      Apply the governing YAML contracts first, then use the matching specimen
      to realize the selected surface. Examples may clarify valid variation but
      may not override a governing or lint contract.
    selection_axes:
      artifact_type:
      - devotional
      - study_guide
      content_length:
      - condensed
      - standard
      - expanded
      render_target:
      - ui
      - pdf
    specimen_ids:
      canonical_ui: EX-UI-STANDARD
      condensed_ui: EX-UI-CONDENSED
      expanded_ui: EX-UI-EXPANDED
      minimal_source_lineage: EX-UI-MINIMAL-LINEAGE
      extensive_source_lineage: EX-UI-EXTENSIVE-LINEAGE
      study_guide: EX-STUDY-GUIDE
      pdf_export: EX-PDF-DEVOTIONAL
    inference_guards:
    - do_not_infer_fixed_reference_count_from_any_specimen
    - do_not_infer_content_length_from_reference_count
    - do_not_infer_pdf_or_study_guide_shape_from_ui_examples
    - quote_is_required_in_every_devotional_specimen
    - image_is_required_for_ui_devotional_when_images_enabled
  output_profiles:
    axis_model: orthogonal
    artifact_type:
      devotional:
        quote_required: true
        primary_scripture_required: true
      study_guide:
        companion_artifact: true
        images_allowed: false
        governing_devotional_quote_and_scripture_must_remain_traceable: true
    content_length:
        authority: engine_core.output_profiles
        expansion_must_add_scriptural_or_pastoral_development_not_repetition: true
    render_target:
      ui:
        image_components_allowed: true
        entity_components_allowed: true
      pdf:
        image_components_allowed: false
        entity_components_allowed: false
        ui_only_tokens_forbidden: true
    standard_audio_optimization:
      applies_to_all_devotional_lengths: true
      images_are_additive: true
      spoken_flow_required: true
    output_profile_rendering:
      authority: engine_core.output_profiles
    
      condensed:
        preserve_concise_surface: true
    
      standard:
        preserve_default_surface: true
    
      expanded:
        preserve_extended_surface: true
    surface_components:
    
      title:
        contract_id: surface.title.v1
    
      quote:
        contract_id: surface.quote.v1
    
      devotional:
        contract_id: surface.devotional.v1
    
      prayer:
        contract_id: surface.prayer.v1
    
      references:
        contract_id: surface.references.v1
  layout:
    supported_orders:
      default:
        name: quote_devotional_reference
        canonical_order:
        - images
        - title_optional
        - quote
        - devotional
        - reference
        - prayer_optional
        - additional_references_optional
        - footnotes_optional
      reversi:
        name: reference_devotional_quote
        canonical_order:
        - images
        - title_optional
        - reference
        - devotional
        - quote
        - prayer_optional
        - additional_references_optional
        - footnotes_optional
    optional_title:
      enabled_by_preference: true
      default: false
      classification: title_line_not_heading
      position: after_images_before_first_primary_surface
      markdown_heading_forbidden: true
      label_forbidden: true
    prayer_slot:
      enabled_by_preference: true
      default: none
      classification: devotional_surface
      position: after_selected_primary_terminal_before_additional_references_and_footer_footnotes
      heading_forbidden: true
      may_be_omitted_when_mode_none: true
    additional_references_slot:
      enabled_by_preference: true
      default: true
      render_only_when_nonempty: true
      classification: source_lineage_metadata
      position: after_prayer_when_present_else_after_selected_primary_terminal_before_footer_footnotes
      terminal_when_no_footnotes: true
      heading_text: Additional References
      heading_exception_scope: this_block_only
    user_option:
      reverse_order_presentation:
        enabled: true
        values:
        - default
        - reversi
        default: default
      forbid_content_after_terminal_element: true
      forbid_section_headings: true
      permitted_metadata_heading:
      - Additional References
      title_is_not_a_heading: true
      prayer_is_not_a_heading: true
      terminal_element_definition: footnotes_when_present_else_additional_references_when_present_else_prayer_when_present_else_selected_primary_terminal
      footnotes_are_footer_metadata_not_section_content: true
      forbid_headers_except_permitted_metadata_heading: true
      forbid_section_titles_except_permitted_metadata_heading: true
    workflow_structure_alias: gdw_v1
    order_integrity:
      freeze_selected_layout_before_repair: true
      fallback_repairs_must_fill_existing_slots: true
      forbid_section_reordering_during_repair: true
  pdf_rendering:
  
    devotional_header:
      enabled: true
  
    collection_header:
      enabled_when_multiple_devotionals: true
  
    forbid:
      - images
      - entities
  surface_role_split:
    enabled: true
    doctrine:
    - devotional_body_is_written_and_interpreted
    - quote_surface_is_reported_not_rewritten
    - reference_surface_is_reported_not_rewritten
    - prayer_surface_preserves_classification_and_source_integrity
    - assembly_combines_surfaces_but_must_not_recompose_them
    role_definitions:
      writer_role:
        owns:
        - devotional_body
        allowed_actions:
        - interpret
        - synthesize
        - paraphrase_inside_body_only
        - apply
        forbidden_actions:
        - rewrite_primary_quote_surface
        - rewrite_primary_reference_surface
      quote_renderer_role:
        owns:
        - primary_quote_text
        - primary_quote_source_line
        required_mode: preserve_only
        forbidden_actions:
        - paraphrase
        - implication
        - interpretive_smoothing
        - editorial_gloss
      reference_renderer_role:
        owns:
        - anchor_reference_line
        - expanded_reference_text_when_enabled
        required_mode: preserve_only
        forbidden_actions:
        - paraphrase
        - devotional_gloss
        - semantic_rewrite
        - interpretive_expansion
      prayer_renderer_role:
        owns:
        - prayer_text
        - prayer_classification
        - liturgical_source_line_when_applicable
        required_mode: preserve_prayer_package_classification
        forbidden_actions:
        - reclassify_generated_prayer_as_liturgical
        - rewrite_liturgical_prayer_to_match_devotional_theme
        - invent_historic_or_liturgical_source_attribution
    assembly_rules:
    - locked_surfaces_must_be_prepared_before_final_render
    - quote_and_reference_surfaces_must_enter_render_as_preserved_strings
    - prayer_package_must_enter_render_with_classification_preserved
    - render_must_place_surfaces_into_slots_without_rewriting
  quote_rendering:
    expanded: true
    attribution_required: true
    quote_text_must_not_be_link: true
    attribution_line_must_contain_single_link: true
    attribution_link_should_bind_author_name: true
    forbid_literal_quote_source_label_in_normal_render: true
    preferred_attribution_shape: dash_author_name_as_single_link
    preserve_selected_quote_text_verbatim: true
    forbid_quote_surface_paraphrase: true
  title_rendering:
    enabled_when_preference_true: true
    default_enabled: false
    source: devotional_title
    preserve_text: true
    render_shape: standalone_plain_text_line
    markdown_heading_forbidden: true
    decorative_prefix_forbidden: true
    decorative_suffix_forbidden: true
    hidden_input_disclosure_forbidden: true
  prayer_rendering:
    authority: engine_core.prayer_output
    enabled_by_preference: true
    default_mode: none
    position: after_selected_primary_terminal_before_additional_references_and_footnotes
    render_shape: standalone_prayer_block
    heading_forbidden: true
    generated:
      classification_required: generated
      source_line_forbidden: true
      historic_or_liturgical_attribution_forbidden: true
      preserve_prayer_text_from_prayer_package: true
    liturgical:
      classification_required: liturgical
      prayer_name_or_source_required: true
      source_line_required: true
      source_line_position: immediately_after_prayer_text
      preserve_verbatim_text_when_package_marks_verbatim_use_permitted: true
      rewrite_to_match_devotional_theme_forbidden: true
      generated_or_reconstructed_text_presented_as_historic_liturgy_forbidden: true
    fallback:
      when_package_classification_is_generated_after_liturgical_request:
        render_as_generated: true
        liturgical_source_line_forbidden: true
        do_not_announce_failed_lookup_in_devotional_surface: true
    audio_optimization:
      prayer_must_read_naturally_aloud: true
      source_line_should_not_interrupt_prayer_body: true
  additional_references_rendering:
    enabled_when_preference_true: true
    default_enabled: true
    omit_when_empty: true
    header_text: Additional References
    allowed_source_classes:
    - supporting_scripture
    - church_father
    - historic_theologian
    - modern_theologian
    - modern_christian_author
    - literary_source
    - other_materially_influential_source
    inclusion_requirements:
    - source_is_in_final_rendered_references
    - source_has_final_footprint_map_entry
    - source_materially_influenced_devotional
    - source_is_not_primary_quote_source
    - source_is_not_primary_anchor
    - source_is_not_equivalent_or_overlapping_primary_anchor
    - source_is_not_duplicate_of_body_quote_footnote_unless_it_had_separate_nonquotation_influence
    exclusion_rules:
    - omit_consulted_only_sources
    - omit_decorative_sources
    - omit_sources_added_to_reach_count
    - omit_duplicate_sources
    - omit_primary_quote_source
    - omit_primary_anchor
    - omit_overlapping_primary_ranges
    count_policy:
      no_fixed_total_count: true
      never_pad_to_target: true
      minimum_composition_is_enforced_separately: true
      supporting_scripture_minimum_is_a_composition_contract_not_a_total_count_quota: true
    preferred_entry_shapes:
      scripture: canonical_scripture_citation_format
      authored_work: author_comma_work_title_with_link_when_available
      general_source: descriptive_plain_text_link_when_available
    footprint_map_is_internal_only: true
    do_not_render_explanatory_footprint_notes: true
    source_hierarchy_visible: true
    required_composition:
      supporting_scripture:
        minimum: 1
        recommended: 2
      non_scriptural_influential_sources:
        minimum: 0
        maximum: null
    ordering_rules:
    - supporting_scripture_entries_first
    - historic_christian_witness_next
    - later_christian_witness_after_historic_sources
    - preserve_influence_and_confidence_order_within_each_group
    patristic_sources:
      allowed_without_specific_cap: true
      must_be_in_addition_to_required_supporting_scripture: true
      must_remain_materially_influential: true
    omit_block_when_empty: false
    block_may_not_be_empty_when_additional_references_are_enabled_because_supporting_scripture_is_required: true
  scripture_source_integrity:
    enabled: true
    governing_rule: scripture_surface_text_must_come_from_bible_text_sources_for_the_selected_translation_not_from_writer_restatements
    allowed_bible_text_sources:
    - direct_bible_translation_provider
    - bible_gateway
    - youversion
    - bible_hub
    forbidden_for_scripture_surface:
    - commentary_rendering
    - sermon_rendering
    - blog_paraphrase
    - devotional_writer_restatement
    - social_media_rephrase
    treatment_rules:
    - if_surface_is_labeled_as_scripture_the_wording_must_be_bible_text_not_writer_summary
    - if_wording_comes_from_a_writer_treat_it_as_a_normal_quote_not_as_scripture_surface
    - if_provenance_is_uncertain_emit_reference_line_only
  reference_rendering:
    hyperlink_required_when_available: true
    translation_default: NIV
    mode_by_position:
      top:
        render_style: expanded_scripture_block_plus_hyperlinked_reference_line
        expanded_text_present: true
        expanded_text_unlinked: true
        reference_line_hyperlinked: true
      bottom:
        render_style: hyperlinked_reference_line_only
        expanded_text_present: false
        reference_line_hyperlinked: true
    position_rules:
    - if_reference_is_top_then_scripture_text_must_expand
    - if_reference_is_bottom_then_scripture_text_must_not_expand
    - bottom_reference_never_expands_even_if_short
    - top_reference_must_expand_even_if_long
    footer_exception:
      allow_footer_footnotes_after_reference: true
      rule: Footer footnotes may appear after the scripture reference when needed for body-quote attribution. They
        are metadata, not an additional devotional section.
    canonical_scripture_citation_format: '[Book Chapter:Verse (Translation)](URL)'
    scripture_citation_applies_globally: true
    scripture_citation_scope:
    - reference_line
    - footer_footnotes
    - body_mentions_when_scripture_is_cited
    scripture_citation_rules:
    - use_bracketed_reference_plus_translation_when_scripture_is_cited
    - use_hyperlinked_markdown_when_link_available
    - do_not_render_scripture_as_entity
    - maintain_same_style_in_footnotes_as_in_reference_line
    expanded_reference_text_must_be_verbatim_when_rendered: true
    if_verbatim_expansion_unavailable: render_reference_line_only
    if_scripture_source_provenance_uncertain: render_reference_line_only
    scripture_surface_must_come_from_bible_text_source: true
    forbid_reference_surface_paraphrase: true
    primary_scripture_surface_rule: The primary scripture may be studied in a larger context, but any overlapping
      expansion remains part of the same anchor and must never be rendered as a separate quotation or citation.
    primary_scripture_isolation:
      render_once_only: true
      reference_section_only: true
      forbid_overlap_range_as_secondary_reference: true
      forbid_subset_or_superset_of_primary_reference_in_footnotes: true
  image_rendering:
    renderer: image_group
    supported_renderer_fallbacks: [native_image_display, markdown_image]
    renderer_policy: use_first_available_supported_renderer_that_displays_actual_image
    acquisition_fallback_authority: engine_core.image_selection.acquisition_fallback
    default_target_count: 1
    max_distinct_images: 3
    prohibit_markdown_images: false
    markdown_images_allowed_only_when_native_renderers_unavailable: true
    markdown_requires_accessible_image_asset: true
    require_prevalidated_image_surface_or_eligible_final_cue: true
    when_entity_missing_before_render: try_supported_image_renderer_then_complete_acquisition_chain
    output_profile:
      standard:
        enabled_by_default: true
    
      pdf:
        enabled: false
  
    failure_behavior:
      complete_search_then_generation_unless_user_objects_then_single_italic_cue
  hyperlink_rendering:
    structured_objects_required: true
    render_source_of_truth: hyperlink_objects
    supported_modes:
    - markdown_link
    - label_then_indented_url_line
    default_mode: markdown_link
    platform_policy:
      ios: markdown_link
      android: markdown_link
      web: markdown_link
      fallback_any_client: label_then_indented_url_line
    validation:
      markdown_pattern: '[label](url)'
      url_must_start_with: http
      required_links:
      - quote_attribution
      - scripture_reference
    conditional_fallback:
      description: If inline markdown hyperlinks are missing, malformed, or fail pattern validation, preserve the
        label on its own line and place the URL on the next indented line. Fallbacks are emitted only for links
        that fail validation.
      detection_rules:
      - missing_label
      - missing_url
      - malformed_markdown_structure
      - url_not_starting_with_http
      - markdown_render_not_attached
      behavior:
        if_any_link_invalid: rewrite_failed_links_to_label_then_indented_url_line
        apply_only_to_failed_links: true
        never_duplicate_valid_links: true
        preserve_label_line: true
        preserve_render_order: true
        canonicalize_repaired_surface_when_any_link_invalid: true
        preserve_selected_slots: true
        fill_failed_link_slot_in_place: true
        forbid_cross_section_reinsertion: true
    fallback_format:
      quote_attribution:
        label: Source
        style: label_then_indented_url_line
      scripture_reference:
        label: Scripture reference
        style: label_then_indented_url_line
      indent_rule:
        spaces: 2
        required: true
        url_must_be_on_next_line: true
    canonical_surface_rule: repaired_surface_is_final_when_rich_render_invalid
    pre_render_validation_required: true
    required_complete_objects:
    - quote_attribution
    - scripture_reference
  workflow_alias: gdw_v1
  degraded_fallback:
    enabled: true
    trigger:
    - rich_render_invalid_or_missing
    - hyperlink_attachment_invalid_or_missing
    - no_supported_image_renderer_succeeded
    preserve_devotional_text_without_rewrite: true
    preserve_prayer_package_without_reclassification: true
    image_behavior:
      when_image_entity_missing: use_supported_renderer_or_complete_acquisition_chain
      emit_single_italic_image_cue_only_after_acquisition_chain_exhausted: true
      hyperlink_failure_alone_must_not_replace_working_image: true
      cue_max_count: 1
    hyperlink_behavior:
      quote_url_line_indent_spaces: 2
      scripture_url_line_indent_spaces: 2
      quote_label_own_line_required: true
      scripture_label_own_line_required: true
      url_must_be_on_next_line: true
      prefer_bare_clickable_url: true
      forbid_inline_raw_url_after_label: true
    final_surface_authority_when_triggered: true
    order_enforcement:
      treat_layout_as_slot_map: true
      fill_missing_elements_in_place: true
      never_reorder_sections: true
      section_order_must_match_selected_layout_before_and_after_repair: true
    footnote_behavior:
      preserve_footer_footnotes_when_present: true
      keep_footnotes_after_additional_references_when_present: true
      forbid_inline_citation_reinsertion: true
  body_quote_rendering:
    allow_direct_quotes_in_body: true
    forbid_direct_quote_of_primary_scripture_reference: true
    allow_secondary_quotes_with_footer_footnotes: true
    inline_attribution_for_body_quotes_forbidden: true
    preferred_behavior: Use quoted language sparingly and let citations collect in the footer so the prose remains
      smooth.
    forbid_primary_scripture_equivalence_range: true
    source_context_expansion_allowed_for_interpretation_only: true
  footnote_rendering:
    enabled: true
    purpose: Attribute any direct quotations used inside the devotional body without consuming inline prose space.
    placement: after_additional_references_when_present_else_after_prayer_when_present_else_after_selected_primary_terminal
    classification: footer_metadata
    trigger: only_when_body_quotes_present
    marker_style: superscript_style_numerals_or_plain_numeric_markers
    ordering: first_appearance
    content_rules:
    - must_not_repeat_primary_scripture_reference_as_a_body_quote_citation
    - must_correspond_to_body_quote_markers
    - must_not_introduce_new_devotional_content
    - must_not_repeat_or_expand_the_primary_scripture_reference
    - must_not_render_subset_or_superset_ranges_of_the_primary_reference
    - may_use_secondary_scripture_only_when_non_overlapping_with_primary_anchor
    scripture_reference_style: same_as_reference_line
    scripture_reference_format: '[Book Chapter:Verse (Translation)](URL)'
    scripture_reference_entity_wrapping_forbidden: true
    scripture_reference_hyperlink_required_when_available: true
    non_scripture_source_preferred_shape: Author, Work Title ([Source](URL)) or equivalent
    primary_scripture_surface_isolation:
      forbid_primary_scripture_in_footnotes: true
      forbid_equivalent_scripture_in_footnotes: true
      allow_only:
      - secondary_scripture_supporting_texts
      - non_scriptural_quotations
    pdf_rules:
      forbid_primary_quote_source_in_footnotes: true
      forbid_additional_reference_duplication: true
      omit_when_no_body_quotes_present: true
  output_targets:
    ui:
      status: default_existing_behavior
      inherits_root_render_rules: true
      title:
        enabled_when_preference_true: true
        markdown_heading_forbidden: true
      prayer:
        enabled_by_preference: true
        modes:
        - generated
        - liturgical
        position: after_selected_primary_terminal_before_additional_references_and_footnotes
        preserve_classification: true
        liturgical_source_required: true
        generated_source_line_forbidden: true
      additional_references:
        enabled_when_preference_true: true
        omit_when_empty: false
        position: after_prayer_when_present_else_after_primary_terminal_surface_before_footnotes
        minimum_supporting_scripture: 1
        recommended_supporting_scripture: 2
        supporting_scripture_first: true
        patristic_sources_additive_not_substitutive: true
        no_fixed_total_reference_count: true
        minimum_supporting_scripture_is_composition_not_quota: true
    pdf:
      enabled: true
      purpose: page_optimized_text_first_render_without_images
      section_order:
      - header
      - primary_quote
      - primary_quote_source
      - devotional
      - anchor_reference
      - prayer_optional
      - additional_references_optional
      - footnotes_optional
      header:
        required: true
        default_shape: weekday_comma_dd_mon_yyyy
      images:
        enabled: false
        rule: omit_images_entirely_for_pdf_output
      primary_quote:
        keep_same_surface_shape_as_ui: true
        footnote_marker_forbidden: true
        source_line_required: true
        source_line_position: immediately_below_primary_quote
        source_line_font_relative: slightly_larger_than_prior_pdf_test_pass
      devotional:
        allow_direct_quotes_in_body: true
        inline_attribution_forbidden: true
        direct_body_quote_citation_mode: footnotes_only
      anchor_reference:
        position: in_flow_after_devotional
        expanded_text_present: true
        hyperlinked_reference_required_when_available: true
        must_appear_before_prayer_and_additional_references: true
        must_not_be_duplicated_below_header: true
        expanded_text_must_be_verbatim: true
        paraphrase_forbidden: true
        if_verbatim_expansion_unavailable: reference_line_only
        if_source_provenance_uncertain: reference_line_only
        source_must_be_bible_text_not_writer_restatement: true
      prayer:
        enabled_by_preference: true
        position: after_anchor_reference_before_additional_references_and_footnotes
        render_as_text_only: true
        generated_source_line_forbidden: true
        liturgical_source_line_required: true
        entities_forbidden: true
      additional_references:
        enabled: true
        header_text: Additional References
        include_only_materially_influential_sources: true
        supporting_scriptures_only: false
        include_primary_anchor: false
        include_primary_quote_source: false
        include_footnote_citations: false
        omit_when_empty: false
        require_source_footprint_map_entry: true
        prohibit_decorative_or_quota_padding_references: true
        minimum_supporting_scripture: 1
        recommended_supporting_scripture: 2
        supporting_scripture_first: true
        patristic_sources_additive_not_substitutive: true
        no_fixed_total_reference_count: true
        minimum_supporting_scripture_is_composition_not_quota: true
      footnotes:
        enabled_when_body_quotes_present: true
        purpose: citation_for_in_text_direct_quotes_in_devotional_body_only
        position: below_additional_references_when_present_else_below_prayer_when_present_else_below_anchor_reference
        smaller_font: true
        must_not_duplicate_additional_references: true
        must_not_duplicate_primary_quote_source: true
        must_not_duplicate_primary_anchor_reference: true
        omit_entire_section_when_empty: true
      spacing:
        increase_section_spacing: true
