version: 2.10.4
file_role: canonical_engine_core
status: reconciled_single_authority
engine_core:
  intent: 'Canonical merged engine core for the devotional system. This file contains the active mathematical tuning,
    study-pass logic, composition staging, editorial-pass architecture, image-selection logic, freshness controls,
    output-length constraints, and interpretive payoff placement.

    '
  governing_principles:
  - scripture_sets_theological_center
  - study_precedes_writing
  - clarity_outranks_elegance
  - image_should_echo_text
  - freshness_requires_memory_of_recent_patterns
  - mathematical_scoring_guides_but_does_not_dominate
  - output_must_remain_brief_enough_for_daily_use
  - insight_should_land_before_the_end
  - editorial_passes_sharpen_parameters_without_full_rewrite
  - structure_is_an_attractor_not_a_cage
  - weekly_motif_may_link_days_but_must_not_replace_daily_thematic_novelty
  - horoscope_defines_the_problem
  - tarot_defines_the_mode
  - quote_targets_problem_through_mode
  - scripture_anchors_problem_plus_mode_in_context
  - study_deepens_without_overriding_the_anchor
  - later_stages_may_sharpen_but_not_erase_upstream_constraints
  - primary_scripture_reference_must_not_be_directly_quoted_in_devotional_body
  - direct_body_quotes_must_use_footer_footnote_attribution
  - all_scripture_references_must_share_one_canonical_citation_style
  - scripture_references_use_bracketed_reference_plus_translation_with_hyperlink_when_available
  - primary_scripture_reference_must_appear_exactly_once_in_surface_output
  - expanded_or_overlapping_primary_ranges_may_inform_study_but_must_not_reappear_as_secondary_surface_references
  - writing_and_quotation_are_distinct_roles_with_distinct_rules
  - devotional_body_is_interpreted_but_quote_and_reference_surfaces_are_preserved_through_reporting
  - scripture_surface_text_must_come_from_bible_text_sources_for_the_selected_translation
  - writer_restatements_of_scripture_must_never_be_reported_as_bare_scripture
  - scripture_interprets_scripture_before_commentary
  - supporting_scripture_is_required_in_rendered_additional_references
  - patristic_and_other_christian_witness_is_additive_to_biblical_cross_reference
  - generated_prayer_must_arise_from_the_devotional_thesis_scripture_and_pastoral_motion
  - liturgical_prayer_must_be_date_appropriate_source_identified_and_never_reconstructed_as_historic_text
  directive_taxonomy:
    enabled: true
    purpose: distinguish_authoritative_requirements_from_observational_health_signals
    categories:
      governing_principle:
        definition: explains_why_the_devotional_system_operates_as_it_does
      reader_contract:
        definition: requirements_owed_to_the_reader
        examples:
        - honor_reader_preferences
        - preserve_daily_devotional_length
        - respect_reading_accessibility
        - preserve_requested_translation
        - distinguish_reading_complexity_from_spiritual_depth
        - honor_requested_prayer_mode_and_tradition
      process_contract:
        definition: requirements_that_preserve_the_integrity_of_devotional_generation
        examples:
        - scripture_sets_theological_center
        - study_precedes_writing
        - scripture_is_interpreted_in_context
        - source_lineage_is_preserved
        - study_material_precedes_optional_study_guide_rendering
        - liturgical_prayer_selection_preserves_calendar_and_source_integrity
      render_contract:
        definition: requirements_governing_what_the_reader_actually_receives
        examples:
        - selected_layout_is_honored
        - references_are_not_decorative
        - hidden_interpretive_tools_remain_hidden
        - production_output_contains_no_debug_footer
      process_health_metric:
        definition: telemetry_used_to_evaluate_system_health_without_becoming_a_quota
        examples:
        - source_count
        - source_class_diversity
        - source_freshness
        - metaphor_freshness
        - application_freshness
        - rendered_reference_count
    interpretation_rule:
    - contracts_may_fail_generation_or_require_repair
    - health_metrics_should_warn_or_inform_unless_a_separate_contract_is_violated
    - numeric_targets_must_not_become_padding_incentives
  source_authority_weights:
    scripture: 1.0
    church_fathers: 0.9
    historic_theologians: 0.8
    modern_theologians: 0.8
    modern_christian_authors: 0.8
    devotional_or_blog_style_writers: 0.5
  source_authority_notes:
  - age_alone_does_not_determine_authority
  - patristic_sources_receive_modest_priority_due_to_linguistic_cultural_and_historical_proximity
  - modern_theologians_and_major_modern_christian_authors_may_equal_historic_theologians_when_their_work_is_substantive
  - devotional_or_blog_style_writers_receive_lower_weight_due_to_thematic_drift_and_variable_doctrinal_depth

  output_profiles:
    condensed:
      purpose: concise_daily_reflection
      paragraph_target:
        preferred: 2
        acceptable: [1, 3]
  
    standard:
      purpose: default_daily_devotional
      paragraph_target:
        preferred: 2
        acceptable: [2, 3]
  
    expanded:
      purpose: extended_daily_devotional
      activation:
        - explicit_user_request
        - persistent_user_preference
      paragraph_target:
        preferred: 5
        acceptable: [4, 6]
      expansion_principle:
        additional_length_must_result_from_new_reasoning_not_restatement

  study_pass:
    enabled: true
    position_in_pipeline: after_scripture_selection_before_writing
    sources_target:
      minimum: 3
      recommended: 5
      soft_maximum: 7
      expansion_beyond_soft_maximum_allowed_when_material_questions_remain: true
      stop_condition:
      - source_diversity_minimum_satisfied
      - confidence_is_high_or_best_available
      - no_material_interpretive_question_remains_unexamined
      - additional_sources_are_likely_redundant_or_low_signal
    source_diversity_balance:
      enabled: true
      minimum_mix:
        scripture_parallel: 1
        historical_or_patristic: 1
        modern_christian_voice: 1
      recommended_mix:
        scripture_parallel: 2
        historical_or_patristic: 2
        modern_christian_voice: 1
    source_classes:
    - scripture_parallel
    - church_fathers
    - historic_theologians
    - modern_theologians
    - modern_christian_authors
    - devotional_or_blog_style_writers
    per_source_extraction:
      fields:
      - primary_theme
      - secondary_themes
      - governing_metaphor
      - pastoral_motion
      - doctrinal_weight
      - practical_application_angle
      - influence_weight
      - source_confidence
      - recognizable_footprints
      - discard_reason_if_discarded
    insight_scoring:
      formula: source_weight * relevance * clarity * distinctiveness + bridge_bonus
      factor_ranges:
        relevance:
        - 0.0
        - 1.0
        clarity:
        - 0.0
        - 1.0
        distinctiveness:
        - 0.0
        - 1.0
        bridge_bonus:
        - 0.0
        - 0.25
    insight_convergence:
      enabled: true
      convergence_formula: 'source_weight * relevance * clarity * distinctiveness * (1 + supporting_sources_factor)
        + bridge_bonus

        '
      supporting_sources_factor:
        rule: supporting_sources / total_sources
    convergence_model:
      cluster_similar_insights: true
      cluster_score: sum(member_scores)
      anti_duplication_penalty:
        enabled: true
        novelty_factor_range:
        - 0.5
        - 1.0
      outputs:
      - core_theme
      - secondary_theme
      - governing_metaphor
      - pastoral_motion
      - confidence
    dedupe_and_vetting:
      dedupe_authors: true
      dedupe_same_text_different_urls: true
      require_quote_scripture_relevance: true
      reject_samey_low_signal_sources: true
    study_brief_output:
      include:
      - core_theme
      - secondary_theme
      - governing_metaphor
      - pastoral_motion
      - insight_clusters
      - source_mix
      - confidence
      - problem
      - mode
      - context_summary
      - thesis_vector
      - source_lineage
      - influential_sources
      - rendered_source_candidates
      - deferred_sources
      - source_affinity_signals
      - source_freshness_signals
      - study_guide_expansion_map
      - source_confidence_map
      - source_weight_map
      - discard_reason_map
      - thesis_provenance
      exclude:
      - raw_research_dump
      - long_excerpts
      - duplicate_links
    inputs:
    - problem
    - mode
    - quote
    - scripture
    purpose: Gather surrounding wisdom after the problem, mode, quote, and scriptural anchor are fixed.
    source_assessment:
      influence_weight:
        allowed:
        - incidental
        - supporting
        - governing
        definition: How strongly the source shapes the final devotional rather than how prestigious the source is.
      source_confidence:
        allowed:
        - low
        - moderate
        - high
        definition: Confidence in relevance, provenance, interpretive reliability, and accurate use.
      discard_reasons:
      - duplicate
      - redundant
      - low_signal
      - off_theme
      - superseded
      - inferior_translation
      - unsupported_claim
      - editorial_bias
      - low_confidence
      rules:
      - every_discarded_source_must_receive_at_least_one_discard_reason
      - low_confidence_sources_may_inform_questions_but_must_not_govern_thesis
      - governing_sources_require_moderate_or_high_confidence
    scripture_cross_reference_pass:
      required: true
      position: after_primary_scripture_selection_before_commentary_study
      minimum_influential: 1
      recommended_influential: 2
      purposes:
      - illuminate_primary_text
      - test_and_balance_interpretation
      - connect_local_context_to_canonical_witness
      - strengthen_biblical_synthesis
      rules:
      - exclude_primary_anchor
      - exclude_overlapping_or_equivalent_primary_ranges
      - do_not_select_by_keyword_alone
      - supporting_passages_must_materially_shape_interpretation_thesis_or_application
  study_transparency:
    enabled: true
    governing_principle: 'The devotional should visibly demonstrate genuine study through the recognizable influence
      of selected sources, without exposing raw research or turning the devotional into a bibliography.

      '
    source_lineage:
      enabled: true
      stages:
        consulted:
          definition: all_sources_examined_during_the_study_pass
          surface_visibility: hidden
        influential:
          definition: sources_that_materially_shape_thesis_metaphor_application_or_interpretation
          surface_visibility: internal_metadata
        rendered:
          definition: influential_sources_selected_for_additional_references
          surface_visibility: external_when_enabled
        deferred:
          definition: useful_influential_material_reserved_for_optional_study_guide_expansion
          surface_visibility: hidden_until_requested
        discarded:
          definition: consulted_sources_rejected_after_influence_or_reliability_assessment
          surface_visibility: hidden_process_telemetry
      permitted_transitions:
      - consulted_to_influential
      - consulted_to_discarded
      - influential_to_rendered
      - influential_to_deferred
      - influential_to_rendered_and_deferred
      forbidden_transitions:
      - consulted_directly_to_rendered_without_influence_assessment
      - discarded_to_rendered
      - decorative_source_to_rendered
      discard_telemetry:
        required: true
        record:
        - source_id
        - discard_reason
        - confidence_at_discard
        - superseding_source_if_any
        purpose: Preserve why a source did not survive so future study can distinguish absence from rejection.
    additional_references:
      purpose:
      - expose_material_source_lineage
      - give_reader_traceability
      - provide_bridge_to_optional_study_guide
      - support_source_discovery
      - make_source_cycling_auditable
      inclusion_rule: 'Render only sources whose influence remains recognizable in the final devotional.

        '
      recognizable_footprints:
      - theological_insight
      - interpretive_claim
      - governing_metaphor
      - pastoral_motion
      - practical_application
      - directly_used_quotation
      - distinctive_conceptual_language
      exclude:
      - consulted_but_unused_sources
      - decorative_sources
      - references_added_to_reach_a_count
      - duplicate_sources
      - sources_with_no_visible_or_conceptual_footprint
      - primary_quote_source
      - primary_scripture_anchor
      - overlapping_or_equivalent_primary_scripture_ranges
      count_policy:
        classification: process_health_metric
        no_required_surface_count: true
        never_pad_to_target: true
        interpretation: 'Reference count is telemetry indicating the breadth and survival of study influence, not
          a presentation quota.

          '
      ordering_rule:
      - supporting_scripture_before_non_scriptural_sources
      - governing_before_supporting_within_each_source_tier
      - higher_confidence_before_lower_confidence
      - preserve_reader_usefulness_over_prestige
      scripture_requirements:
        minimum_rendered_supporting_scripture: 1
        recommended_rendered_supporting_scripture: 2
        primary_anchor_excluded: true
        overlapping_or_equivalent_primary_ranges_excluded: true
        supporting_scripture_precedes_non_scriptural_sources: true
      patristic_relationship:
        patristic_sources_are_additive_not_substitutive: true
        no_maximum_specific_to_patristic_sources: true
        render_when_materially_influential: true
  study_guide_preparation:
    enabled: true
    always_prepare_expansion_ready_material: true
    render_by_default: false
    governing_principle: 'A later study guide should grow from the same source lineage, thesis, interpretive logic,
      and governing metaphor as the devotional rather than being invented after the devotional is complete.

      '
    stable_anchors:
    - devotional_title
    - primary_quote
    - primary_scripture
    - thesis_vector
    - governing_metaphor
    - pastoral_motion
    - influential_sources
    - rendered_sources
    - deferred_sources
    optional_expansion_sections:
    - primary_scripture_context
    - supporting_scriptures
    - historical_and_patristic_witnesses
    - modern_theological_witnesses
    - metaphor_development
    - reflection_questions
    - practical_application
    - source_notes
    continuity_requirement:
    - later_guide_must_preserve_original_thesis
    - later_guide_must_preserve_primary_anchor
    - later_guide_must_explain_rendered_reference_footprints
    - later_guide_may_include_deferred_influential_sources
    - later_guide_must_not_present_an_unrelated_second_devotional
  composition_stages:
    conceptual_attractor_pass:
      enabled: true
      enforcement: advisory_only
      purpose: 'Provide structural guidance without hardcoding sentence templates.

        '
      attractors:
      - human_experience_presence
      - interpretive_turn_precedes_final_line
      - reader_facing_application
      - resolution_not_revelation
      scoring:
        method: gravitational
        components:
        - payoff_alignment
        - conceptual_progression
        - metaphor_unity
        - reader_application_presence
        - resolution_integrity
    draft_zero:
      enabled: true
      purpose: 'Free writing pass that follows the study brief and conceptual attractors loosely, allowing formative
        improvisation.

        '
      rules:
        allow_improvisation: true
        prioritize_authentic_voice: true
        avoid_self_editing: true
    structural_draft_pass:
      enabled: true
      purpose: 'Ensure the devotional has clear movement and stable architecture before editorial passes begin.

        '
      checks:
      - logical_flow
      - paragraph_balance
      - scripture_integration
      - clarity_of_central_insight
      - removal_of_major_redundancy
  surface_role_split:
    enabled: true
    doctrine:
      writer_role: devotional_body_only
      quote_renderer_role: primary_quote_and_source_only
      reference_renderer_role: anchor_reference_surface_only
    writer_role_rules:
    - interpret_inside_devotional_body
    - paraphrase_only_inside_devotional_body_when_needed
    - direct_quote_only_when_it_serves_a_real_purpose
    - never_own_primary_quote_surface_text
    - never_own_primary_reference_surface_text
    quote_renderer_rules:
    - preserve_selected_quote_text_verbatim
    - preserve_selected_quote_source_verbatim
    - never_paraphrase
    - never_imply_meaning
    - never_emit_editorial_gloss
    reference_renderer_rules:
    - preserve_selected_reference_text_verbatim_when_expanded
    - never_paraphrase_reference_text
    - never_emit_devotional_gloss_as_reference_text
    - if_verbatim_expansion_is_unavailable_fall_back_to_reference_line_only
    - only_use_bible_text_sources_for_selected_translation_when_rendering_scripture_text
    - if_wording_comes_from_a_writer_treat_it_as_quote_material_not_scripture_surface
    - if_source_provenance_is_uncertain_fall_back_to_reference_line_only
  writing_constraints:
    devotional_structure:
      output_profile_controls_length: true
    
      default_profile: standard
    
      paragraph_roles:
        opening:
          purpose: establish_principle
      
        closing:
          purpose: apply_to_reader_today
      
        expanded_paragraphs:
          expanded_profile_only: true
          purpose:
            - deepen_biblical_context
            - deepen_interpretive_synthesis
            - enrich_practical_application
          constraints:
            - preserve_single_governing_thesis
            - continue_forward_progress
            - preserve_clear_paragraph_progression
            - continue_development_without_repetition
            - never_repeat_previous_paragraphs
    structural_balance_ratio:
      enabled: true
      model: golden_ratio_bias
      target_ratios:
        quote: 0.15
        paragraph_1: 0.38
        paragraph_2: 0.47
        reference: 0.05
      tolerance:
        quote: 0.08
        paragraph_1: 0.1
        paragraph_2: 0.1
        reference: 0.03
    payoff_placement:
      enabled: true
      doctrine: 'The interpretive payoff should land before the devotional ends. Do not place the main insight in
        the final sentence.

        '
      preferred_anchor:
        paragraph: 2
        sentence: 1
      target_progress_ratio: 0.62
      acceptable_band:
      - 0.56
      - 0.72
      roles:
        pre_anchor_material: setup_and_exploration
        anchor_sentence: interpretive_turn
        post_anchor_material: application_and_resolution
      enforcement:
      - key_realization_should_appear_by_paragraph_2_sentence_1_when_possible
      - final_sentence_should_land_application_not_introduce_main_theme
      - avoid_story_climax_at_last_line
    sentence_integrity:
      enabled: true
      protect_against:
      - compression_distortion
      - false_rhetorical_escalation
      - synthetic_aphorism
      rule: beauty_must_serve_clarity
    devotional_length_guidance:
      classification: process_health_metric
      preferred_word_bands:
        condensed: [140, 200]
        standard: [180, 270]
        expanded: [350, 550]

      governing_rule:
        - paragraph_completeness_precedes_word_count
        - reading_complexity_may_shift_natural_length

      forbid:
        - padding_to_reach_target
        - trimming_only_to_reach_target
    body_quote_policy:
      allow_direct_quotes_in_body: true
      forbid_direct_quote_of_primary_scripture_reference: true
      purpose: Preserve the primary scripture reference as the confirming anchor rather than duplicating its wording
        inside the devotional body.
      allow_secondary_or_supporting_quotes: true
      attribution_mode_for_body_quotes: footer_footnotes
      forbid_inline_attribution_for_body_quotes: true
      footnotes_do_not_count_as_devotional_body_words: true
      scripture_citation_style: Use the same bracketed reference-plus-translation hyperlink style for any scripture
        citation, including footnotes.
      forbid_entity_wrapping_for_scripture_references: true
      forbid_primary_scripture_equivalence_range_on_surface: true
      forbid_overlapping_or_expanded_primary_ranges_as_secondary_references: true
      surface_rule: The primary scripture may be studied in a larger context, but any overlapping expansion remains
        part of the same anchor and must never be rendered as a separate quotation or citation.
      source_context_expansion_allowed_for_interpretation: true
    primary_scripture_isolation:
      enabled: true
      severity: fatal
      core_rule:
      - primary_scripture_reference_must_appear_exactly_once_in_surface_output
      - primary_scripture_reference_must_only_appear_in_reference_section
      - primary_scripture_reference_must_not_be_quoted_or_partially_quoted_anywhere_else
      - primary_scripture_reference_must_not_be_repeated_in_footer_footnotes
      - expanded_or_overlapping_ranges_of_primary_reference_must_not_be_rendered_as_secondary_references
    scripture_context_expansion_policy:
      enabled: true
      source_use_allowed:
      - immediate_passage_context
      - overlapping_or_expanded_verse_range_for_interpretation
      - local_argument_of_section
      - book_level_argument_when_relevant
      source_use_purpose:
      - clarify_original_meaning
      - prevent_prooftexting
      - support_study_pass
      - strengthen_theological_accuracy
      surface_output_restrictions:
      - do_not_render_expanded_range_as_new_reference
      - do_not_quote_expanded_range_in_body_or_footnotes_if_it_overlaps_primary_reference
      - do_not_cite_subset_or_superset_of_primary_reference_as_supporting_scripture
      - preserve_single_anchor_reference_on_surface
    primary_scripture_equivalence:
      definition:
      - same_book_same_chapter_any_overlapping_verse_range
      - superset_of_primary_reference
      - subset_of_primary_reference
      - adjacent_context_used_only_to_restate_primary_anchor
      treatment:
      - treat_as_same_reference_for_surface_rendering
      - allow_for_internal_study_only
      - forbid_as_secondary_citation
      - forbid_as_body_quote
      - forbid_as_footer_footnote_reference
  editorial_passes:
    policy:
      passes_are_precision_edits_not_full_rewrites: true
      early_passes_protect_meaning: true
      later_passes_polish_expression: true
      orthogonal_editing_goal: true
    ordered_passes:
    - theology_pass
    - pastoral_safety_check
    - coherence_pass
    - applicability_pass
    - voice_pass
    - compression_pass
    - literary_style_pass
    - memorization_pass
    - tts_pass
    - length_pass
    - sounding_pass
    theology_pass:
      purpose: doctrinal_integrity
      checks:
      - scripture_used_in_context
      - aligns_with_broad_biblical_teaching
      - avoids_prosperity_gospel_logic
      - avoids_moralism_without_grace
      - pastoral_humility
      - avoids_implying_unbiblical_promises
      - scripture_application_flows_from_original_meaning
      - no_prooftexting
      - no_context_detachment
      - do_not_duplicate_primary_scripture_wording_inside_body
      - scripture_citations_remain_canonically_formatted_wherever_they_appear
    pastoral_safety_check:
      purpose: protect_readers_in_suffering
      checks:
      - avoid_shaming_language
      - avoid_blame_for_hardship
      - acknowledge_real_struggle
      - tone_of_compassion
    coherence_pass:
      purpose: narrative_clarity
      checks:
      - remove_logical_gaps
      - eliminate_contradictions
      - ensure_clear_argument
      - body_quotes_must_not_interrupt_devotional_flow_with_inline_attribution
      - scripture_footnotes_match_reference_section_citation_style
    applicability_pass:
      purpose: lived_intersection
      checks:
      - real_life_connection
      - practical_reflection
      - emotional_recognition
      - relatable_human_tension
      - avoids_vague_encouragement
    voice_pass:
      purpose: pastoral_tone_calibration
      checks:
      - warmth
      - humility
      - avoid_preachiness
      - conversational_accessibility
      - wise_companion_not_pulpit_performance
    compression_pass:
      purpose: remove_filler_language
      checks:
      - remove_extraneous_words
      - tighten_phrasing
      - remove_redundancy
      - remove_duplicated_primary_scripture_quotation_from_body_when_present
    literary_style_pass:
      purpose: aesthetic_enrichment
      goals:
      - lyrical_flow
      - evocative_imagery
      - occasional_alliteration
      - natural_rhythm
      - elevated_but_welcoming_diction
      - gentle_reader_vocabulary_growth
      - allow_well_placed_secondary_quotations_without_breaking_flow
      lexical_elevation_rules:
        target_words: 1
        maximum_words: 2
        forbid_first_sentence: true
        discourage_final_sentence: true
        must_not_be_load_bearing: true
        must_not_carry_core_theme: true
        must_not_be_interpretive_turn: true
        must_not_be_memorization_line: true
        reader_comprehension_without_word: required
    memorization_pass:
      purpose: reinforce_resonant_line
      rules:
      - strengthen_memorable_sentence
      - avoid_forced_aphorisms
      - maintain_natural_voice
      - prefer_secondary_quoted_language_over_primary_scripture_repetition_when_a_direct_quote_is_helpful
    tts_pass:
      purpose: spoken_delivery_optimization
      checks:
      - allow_contractions
      - natural_cadence
      - avoid_tongue_twisters
      - conversational_rhythm
      - breath_length_smoothing
    length_pass:
      purpose: enforce_word_range_after_all_edits
      rule: 'Adjust length only after all editorial passes are complete to prevent destructive trimming by lint
        checks.

        '
      constraints:
        preferred_band_words:
        - 180
        - 270
        hard_max_words: 320
        strongly_discourage_near_hard_cap: true
        minimize_disturbance: true
    sounding_pass:
      purpose: ensure_unified_voice_and_flow
      checks:
      - voice_continuity
      - sentence_flow
      - rhythm_balance
      - imagery_cohesion
      - paragraph_unity
      allowed_edits:
      - transition_smoothing
      - minor_word_adjustments
      - sentence_merge_or_split
      prohibited_edits:
      - new_theological_content
      - structural_changes
      - new_metaphors
  image_selection:
    acquisition_fallback:
      applies_when: ui_devotional_and_images_enabled
      order:
      - search_similar_image
      - generate_image_unless_user_objects
      - italic_image_cue
      search:
        required_before_generation: true
        include_conceptually_similar_images: true
        success_requires: suitable_accessible_image_displayed_with_supported_renderer
        unavailable_tool_counts_as_unavailable_attempt: true
        preserve_source_credit_when_required: true
      generation:
        allowed_by_default: true
        skip_when_user_objects: true
        attempt_when: search_unavailable_or_no_suitable_accessible_displayable_result
        success_requires: generated_image_displayed_with_supported_renderer
        unavailable_tool_counts_as_unavailable_attempt: true
        identify_as_generated_when_provenance_is_shown: true
      final_text_cue:
        only_when: search_unsuccessful_and_generation_unsuccessful_unavailable_or_user_declined
        format: single_italic_image_description
        must_not_be_presented_as_rendered_image: true
      execution:
        preserve_selected_image_slot_and_devotional_text: true
        do_not_regenerate_an_already_displayed_image: true
        do_not_repeat_failed_attempts_without_new_information: true
        record_attempt_outcomes_and_skip_reasons_in_internal_metadata: true
        skip_entire_chain_when_images_disabled_or_pdf_or_study_guide: true
    target_count: 1
    allow_additional_images_only_if_truly_distinct: true
    max_distinct_images: 3
    governing_metaphor_extractor:
      enabled: true
      inputs:
      - devotional_draft
      - study_brief
      - selected_scripture
      - selected_quote
    metaphor_weight_scorer:
      enabled: true
      score_components:
        frequency_in_text: 0.25
        placement_prominence: 0.2
        scripture_imagery_overlap: 0.2
        study_brief_imagery_overlap: 0.2
        image_searchability: 0.15
    resonance_feedback_loop:
      enabled: true
      formula: 'metaphor_presence_in_quote + metaphor_presence_in_scripture + metaphor_presence_in_application

        '
    selection_priority:
    - literal_match_with_governing_metaphor
    - conceptual_match_with_core_theme
    - mood_alignment_with_pastoral_motion
    image_distinctiveness_scoring:
      formula: resonance + distinctiveness + compositional_strength - duplication_penalty
      factor_ranges:
        resonance:
        - 0.0
        - 1.0
        distinctiveness:
        - 0.0
        - 1.0
        compositional_strength:
        - 0.0
        - 1.0
        duplication_penalty:
        - 0.0
        - 1.0
    near_duplicate_suppression:
      enabled: true
      visual_similarity_threshold: 0.7
      rule: prefer_fewer_images_over_near_duplicates
    wording_echo_policy:
      enabled: true
      strength: light
      rule: allow_image_to_subtly_inform_final_phrasing_without_driving_the_message
    avoid:
    - generic_stock_devotional_symbols
    - occult_imagery
    - divisive_symbolism
    - tarot_imagery
    - repeated_near_identical_forest_path_sets
  reader_profile_model:
    enabled: true
    principles:
    - store_stable_internal_levels
    - present_levels_in_contextually_tactful_language
    - prefer_natural_conversation_over_form_like_questioning
    - infer_preferences_from_user_language_when_reasonable
    - avoid_framing_lower_complexity_as_lower_intelligence
    - keep_reading_complexity_independent_from_spiritual_depth
    - allow_explicit_user_overrides
    independent_axes:
      reading_complexity:
        values:
        - early_reader
        - elementary
        - middle_school
        - high_school
        - college
        - college_advanced
        governs:
        - sentence_length
        - vocabulary_decoding_difficulty
        - syntactic_complexity
        - visual_density
        - paragraph_load
      spiritual_depth:
        values:
        - seeker
        - foundational
        - growing
        - mature
        - scholarly
        governs:
        - theological_nuance
        - historical_depth
        - interpretive_density
        - doctrinal_vocabulary
        - complexity_of_application
    reading_complexity_principles:
    - simplify_decoding_before_simplifying_thought
    - preserve_authorial_voice
    - preserve_theological_precision
    - preserve_emotional_rhythm
    - preserve_natural_written_prose
    - preserve_paragraph_cohesion
    - simplify_structure_only_when_it_improves_comprehension
    - avoid_unnecessary_stylization_that_increases_decoding_effort
    - rhetorical_devices_should_support_comprehension
    - avoid_rhyming_couplets_unless_explicitly_requested
    governing_rule: 'Lower reading complexity must not automatically reduce spiritual or theological depth. Natural
      prose remains the default at every level.

      '
    naming_consistency:
      internal_names_are_canonical: true
      user_facing_labels_may_vary_by_context: true
      fixed_translation_tables_not_required: true
    preference_discovery:
      directive: 'Ask about comfort, interests, and desired detail in natural language. Translate the response into
        canonical profile values without requiring the user to self-identify with educational or spiritual labels.

        '
    dyslexia_optimization:
      enabled_when_requested: true
      rules:
      - prefer_shorter_sentences_when_helpful
      - reduce_nested_clauses
      - reduce_visual_density
      - use_concrete_language_where_possible
      - keep_paragraph_movements_clear
      - preserve_natural_paragraphs
      - preserve_theological_substance
      - avoid_childish_tone_unless_age_profile_requires_it
  source_affinity:
    enabled: true
    purpose: 'Select secondary conversation partners partly in light of the reader''s demonstrated interests while
      preserving scriptural authority and source diversity.

      '
    affinity_inputs:
    - reader_age
    - demonstrated_interests
    - current_study_focus
    - previous_positive_engagement
    - explicitly_requested_traditions_or_authors
    candidate_source_affinities:
    - wisdom_literature
    - church_fathers
    - historic_theologians
    - modern_theologians
    - literary_sources
    - devotional_writers
    authority_rules:
    - scripture_priority_must_never_be_overridden
    - affinity_does_not_increase_intrinsic_source_authority
    - reader_affinity_may_break_ties_between_equally_suitable_sources
    - affinity_must_not_eliminate_source_diversity
    - affinity_must_not_force_a_source_that_does_not_fit_the_thesis
  source_cycling:
    enabled: true
    classification: process_health_metric
    tracked_dimensions:
    - individual_source
    - author
    - source_class
    - historical_period
    - christian_tradition
    - scripture_book
    - metaphor_class
    - application_domain
    goals:
    - broaden_reader_exposure
    - prevent_default_author_gravity
    - preserve_freshness_without_forcing_novelty
    - keep_affinity_sources_available_without_excessive_repetition
    warnings:
    - repeated_secondary_author_inside_recent_window
    - repeated_patristic_author_inside_recent_window
    - repeated_modern_author_inside_recent_window
    - narrow_source_class_mix_over_time
    - affinity_source_overuse
    governing_rule: 'Freshness serves the reader and the devotional. It must never replace a clearly superior source
      merely to satisfy rotation telemetry.

      '
  title_generation:
    enabled: true
    default_visibility: false
    purpose:
    - provide_memorable_theme_artifact
    - support_retrieval
    - crystallize_governing_metaphor
    rules:
    - title_must_emerge_from_thesis_or_governing_metaphor
    - title_must_not_introduce_a_theme_absent_from_the_devotional
    - title_should_be_short
    - title_should_not_reveal_hidden_astrology_or_tarot_inputs
    - title_is_not_a_markdown_heading
    - title_visibility_is_controlled_by_reader_preference
  prayer_output:
    enabled: true
    preference_authority: preferences.reader_contract_preferences.prayer
    default_mode: none
    modes:
      none:
        render_prayer: false
      generated:
        render_prayer: true
        classification: generated
        source_inputs:
        - devotional_thesis
        - primary_scripture
        - pastoral_motion
        - reader_profile
        requirements:
        - preserve_theological_center_of_devotional
        - preserve_requested_reading_complexity_and_spiritual_depth
        - prayer_must_not_introduce_new_doctrine_or_new_primary_theme
        - prayer_must_not_claim_historic_or_liturgical_provenance
      liturgical:
        render_prayer: true
        classification: liturgical
        supported_traditions:
        - catholic
        - anglican
        - auto
        selection_inputs:
        - civil_date
        - liturgical_date
        - requested_or_inferred_tradition
        - calendar_observance
        selection_priority:
        - proper_prayer_for_calendar_date
        - feast_or_saint_day_prayer
        - seasonal_or_week_collect
        - ordinary_daily_prayer
        requirements:
        - date_appropriateness_must_be_established
        - tradition_must_be_identified
        - prayer_name_or_source_must_be_identified
        - exact_text_may_be_used_only_when_provenance_and_verbatim_use_are_permitted
        - liturgical_prayer_must_not_be_rewritten_to_match_devotional_theme
        - generated_or_reconstructed_text_must_never_be_presented_as_historic_liturgy
    auto_tradition_resolution:
      priority:
      - explicit_reader_preference
      - persistent_reader_tradition_preference
      - suitable_date_specific_prayer_with_reliable_provenance
      - generated_fallback
      governing_rule: auto_selects_a_valid_tradition_only_when_a_suitable_prayer_can_be_identified_with_confidence
    fallback_policy:
      when_liturgical_prayer_unavailable_or_verbatim_use_not_permitted: generated
      fallback_classification_must_be_generated: true
      liturgical_source_attribution_for_fallback_forbidden: true
      preserve_reader_request_intent: true
    source_integrity:
      historic_or_liturgical_claim_requires_traceable_source: true
      source_name_or_prayer_name_required_for_liturgical_mode: true
      do_not_reconstruct_liturgical_text_from_memory_as_verbatim: true
      if_provenance_is_uncertain: use_generated_fallback
    thematic_independence:
      generated_prayer_should_echo_devotional: true
      liturgical_prayer_should_follow_calendar_not_devotional_theme: true
      do_not_reject_valid_liturgical_prayer_for_theme_mismatch: true
  freshness_controls:
    redundancy_decay:
      enabled: true
      window_days: 7
      decay_factor: 0.6
      targets:
      - metaphor
      - phrasing
      - exhortation_pattern
      - cadence_frame
      - imagery_theme
      - theme_cluster
    freshness_entropy:
      enabled: true
      tracked_dimensions:
      - primary_theme
      - theme_cluster
      - theological_focus
      - application_angle
      - metaphor_class
      - imagery_theme
      - exhortation_pattern
      - cadence_frame
      - secondary_author
      - source_class
      - historical_period
      - christian_tradition
      entropy_formula: 1 - repetition_probability
      action_if_low_entropy:
      - rotate_primary_theme
      - rotate_theological_focus
      - alter_entry_point
      - alter_application_angle
      - prefer_alternate_image_scene
    daily_theme_freshness:
      enabled: true
      priority: hard_requirement
      doctrine: 'Weekly motif continuity may persist in the background, but each daily devotional must present a
        distinctly fresh primary theme. If a new devotional substantially overlaps a recent devotional in primary
        theme, semantic theme cluster, theological focus, or application angle, it must be revised before render.

        '
      lookback_days: 3
      compare_dimensions:
      - primary_theme
      - theme_cluster
      - theological_focus
      - application_angle
      - mode
      - application_domain
      semantic_cluster_matching:
        enabled: true
        reject_near_equivalents:
        - patience_endurance_perseverance_waiting
        - fear_anxiety_worry
        - gratitude_thankfulness_contentment
        - obedience_submission_surrender
      failure_condition:
        fail_if_same_primary_theme: true
        fail_if_same_theme_cluster: true
        fail_if_overlap_dimensions_gte: 2
        fail_if_same_problem_plus_mode_pair: true
      action_on_failure:
      - regenerate_theme
      - rotate_theological_focus
      - rotate_application_angle
      - rotate_governing_metaphor_class
      - rotate_mode
      - rotate_application_domain
    weekly_theme_interaction:
      allow_intentional_motif_reuse: true
      only_when_within_weekly_theme: true
      forbid_explicit_backreference: true
      motif_background_only: true
      motif_must_not_be_primary_theme: true
      daily_theme_must_be_new: true
  final_quality_signals:
    confidence_outputs:
    - theme_confidence
    - metaphor_confidence
    - image_confidence
    - application_confidence
    - payoff_confidence
    harmony_score:
      enabled: true
      role: advisory_only
      components:
      - quote_scripture_alignment
      - study_brief_coherence
      - metaphor_unity
      - image_resonance
      - paragraph_progression
      - lexical_freshness
      - payoff_placement
    fail_soft_behavior:
      if_confidence_low:
      - simplify_application
      - prefer_clearer_image
      - avoid_overclaiming
      - keep_devotional_compact
      - move_interpretive_turn_earlier
      - prefer_prebuilt_degraded_surface_over_broken_rich_render
  progressive_reasoning:
    enabled: true
    governing_principle: Each upstream stage defines a real constraint for the next stage. Later stages may deepen,
      sharpen, and synthesize earlier material, but may not erase or replace it.
    stages:
      horoscope_problem_definition:
        role: define_the_reader_need
        outputs:
        - problem
        - theme_cluster
        - intensity
        rules:
        - must_define_the_core_problem_for_today
        - must_not_write_the_devotional
        - must_not_determine_mode_or_application_by_itself
      tarot_mode_selection:
        role: determine_how_today_problem_is_examined
        outputs:
        - mode
        - biblical_theme_family
        - application_domain
        rules:
        - mode_must_not_replace_problem
        - mode_must_refract_problem_into_a_distinct_angle
        - mode_must_bind_quote_selection
        - mode_must_bind_scripture_selection
        - mode_must_bind_final_application
      quote_selection:
        role: provide_human_wisdom_at_problem_mode_intersection
        selection_rule: quote relevance must be scored at the intersection of problem and mode, not merely against
          the problem alone.
        rules:
        - quote_must_speak_to_problem_through_mode
        - quote_must_not_be_generic_encouragement
        - reject_quote_if_it_fits_problem_but_not_mode
        - reject_quote_if_it_fits_mode_but_not_problem
      scripture_selection:
        role: choose_primary_biblical_anchor_through_the_logic_of_the_quote
        rules:
        - scripture_must_be_selected_through_the_quote_logic_not_independently_of_it
        - scripture_must_ground_or_correct_or_deepen_the_quote
        - scripture_must_be_capable_of_generating_the_study_pass
        - scripture_must_center_the_final_devotional
        - scripture_rotation_algorithm_must_prevent_same_book_clustering
        - reference_is_not_an_afterthought
      study_pass:
        role: gather_surrounding_wisdom_after_anchor_is_fixed
        rules:
        - study_must_deepen_selected_scripture_not_override_it
        - study_must_help_formulate_thesis
        - study_must_expand_freshness_and_metaphor_space
        - study_must_not_collapse_mode_back_into_generic_theme
      thesis_synthesis:
        role: derive_devotional_claim
        formula: problem + mode + quote + scripture + study
        rules:
        - thesis_must_preserve_problem
        - thesis_must_show_mode
        - thesis_must_be_grounded_in_scripture_context
        - thesis_must_be_specific_enough_to_differ_from_recent_days
        outputs:
        - thesis
        - thesis_provenance
        provenance_requirements:
        - identify_problem_contribution
        - identify_mode_contribution
        - identify_quote_logic_contribution
        - identify_scripture_context_contribution
        - identify_influential_study_sources
        - reject_thesis_with_no_traceable_parentage
      scripture_quote_dependency_guard:
        role: verify_real_dependency_between_quote_logic_and_scripture_selection
        outputs:
        - dependency_verdict
        rules:
        - quote_logic_must_be_traceable_into_scripture_selection
        - study_must_flow_from_scripture_not_quote
        - reject_scripture_that_is_only_thematically_adjacent
        - reject_pairs_where_the_devotional_would_read_the_same_with_a_different_reference
  scripture_context_integrity:
    enabled: true
    purpose: prevent_context_violation_and_prooftexting
    governing_rule: No scripture reference may be used in a way that contradicts, ignores, or materially distorts
      the meaning it bears in its original literary, historical, and canonical context.
    interpretive_hierarchy:
    - immediate_passage_context
    - local_argument_of_section
    - purpose_of_book_when_relevant
    - canonical_consistency
    - pastoral_application
    allowed:
    - pastoral_application_consistent_with_original_meaning
    - analogical_extension_when_textual_logic_supports_it
    - devotional_emphasis_on_a_true_implication_of_the_text
    - concise_rendering_when_full_context_is_respected_in_study
    - expanded_context_may_be_used_for_internal_interpretation_without_creating_a_new_surface_reference
    forbidden:
    - keyword_based_reference_selection_without_context_fit
    - motivational_reframing_that_reverses_the_text
    - universalizing_a_limited_promise_without_warrant
    - individualizing_a_corporate_text_without_warrant
    - extracting_comfort_from_a_text_whose_force_is_warning_unless_warning_is_honored
    - treating_narrative_description_as_direct_command_or_promise_without_support
    - rendering_an_overlapping_expansion_of_the_primary_reference_as_a_new_supporting_citation
    - using_subset_or_superset_ranges_of_the_primary_reference_in_footnotes_or_body_quotes
    decision_rules:
    - if_the_text_only_fits_by_shared_vocabulary_reject_it
    - if_the_text_fits_problem_but_not_mode_reject_it
    - if_the_application_requires_ignoring_the_passage_argument_reject_it
    - if_the_application_is_true_biblically_but_not_true_of_this_text_choose_another_text
    - if_an_expanded_range_overlaps_the_primary_reference_treat_it_as_the_same_anchor_for_surface_output
    - if_context_requires_a_broader_internal_reading_keep_that_broader_range_inside_study_only
    output_requirement:
      internal_context_note_required: true
      internal_fields:
      - why_this_text_fits_the_problem
      - why_this_text_fits_the_mode
      - what_the_text_means_in_context
      - how_the_devotional_application_flows_from_that_meaning
  source_hierarchy:
    enabled: true
    principle: scripture_interprets_scripture_before_commentary
    tiers:
    - rank: 1
      class: primary_scripture_anchor
      role: governing_biblical_text
    - rank: 2
      class: supporting_scripture
      role: biblical_cross_reference_and_canonical_synthesis
    - rank: 3
      class: historic_christian_witness
      includes:
      - church_fathers
      - early_church
      - creedal
      - monastic
      - historic_theologians
      role: illumination_under_scriptural_authority
    - rank: 4
      class: later_christian_witness
      includes:
      - modern_theologians
      - modern_christian_authors
      - devotional_or_blog_style_writers
      role: later_interpretive_and_pastoral_support
    rules:
    - supporting_scripture_must_be_gathered_before_non_scriptural_commentary
    - non_scriptural_sources_must_not_substitute_for_supporting_scripture
    - patristic_sources_may_be_numerous_when_influential_but_are_rendered_in_addition_to_supporting_scripture
